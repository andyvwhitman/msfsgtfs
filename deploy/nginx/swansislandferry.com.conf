# nginx site config for swansislandferry.com  (MSFS-GTFS Flask app)
#
# Install on the server as:
#   /etc/nginx/sites-available/swansislandferry.com
#   (symlinked into /etc/nginx/sites-enabled/)
#
# Model: gunicorn runs the Flask app on a unix socket; nginx terminates TLS and
# reverse-proxies to it. "www" is canonical: the apex (swansislandferry.com)
# redirects to www, and HTTP redirects to HTTPS.
#
# PREREQUISITE: the TLS cert must cover BOTH names. A redirect alone CANNOT fix
# the apex — the TLS handshake completes before nginx can redirect, so the apex
# must be a valid name on the cert or browsers error before the redirect runs.
# Reissue once with:
#   sudo certbot --nginx -d www.swansislandferry.com -d swansislandferry.com
# (the cert still lives at live/www.swansislandferry.com/ — it just gains the
# apex as an additional SAN.) The apex must also have a DNS A/AAAA record.

# --- HTTP (both names): upgrade to canonical HTTPS www ---
server {
    listen 80;
    listen [::]:80;
    server_name swansislandferry.com www.swansislandferry.com;
    return 301 https://www.swansislandferry.com$request_uri;
}

# --- HTTPS apex: redirect to www (needs the apex on the cert; see above) ---
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name swansislandferry.com;

    ssl_certificate     /etc/letsencrypt/live/www.swansislandferry.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.swansislandferry.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://www.swansislandferry.com$request_uri;
}

# --- HTTPS www: serve the app ---
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.swansislandferry.com;

    ssl_certificate     /etc/letsencrypt/live/www.swansislandferry.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.swansislandferry.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Security headers
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options        SAMEORIGIN always;
    add_header Referrer-Policy        strict-origin-when-cross-origin always;
    # Enable HSTS only after confirming HTTPS works on both names:
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Static assets straight from disk (skips gunicorn)
    location /static/ {
        alias /var/www/msfsgtfs/backend/static/;
        expires 7d;
        access_log off;
    }

    # Everything else -> gunicorn (Flask app) over its unix socket
    location / {
        proxy_pass http://unix:/tmp/msfsgtfs/msfsgtfs.sock;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
